<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="ng" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366f1"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <!-- edges: a graph tracing an abstract N -->
  <g stroke="url(#ng)" stroke-width="3.2" fill="none" stroke-linecap="round">
    <path d="M14 50 L14 14 L50 50 L50 14"/>
    <path d="M14 14 L32 32" opacity="0.35"/>
    <path d="M32 32 L50 14" opacity="0.35"/>
    <path d="M14 50 L32 32" opacity="0.35"/>
  </g>
  <!-- nodes -->
  <g fill="url(#ng)">
    <circle cx="14" cy="14" r="6"/>
    <circle cx="14" cy="50" r="6"/>
    <circle cx="50" cy="14" r="6"/>
    <circle cx="50" cy="50" r="6"/>
    <circle cx="32" cy="32" r="4.5"/>
  </g>
  <!-- synapse accents -->
  <g fill="#c7d2fe">
    <circle cx="14" cy="14" r="2.2"/>
    <circle cx="14" cy="50" r="2.2"/>
    <circle cx="50" cy="14" r="2.2"/>
    <circle cx="50" cy="50" r="2.2"/>
    <circle cx="32" cy="32" r="1.6"/>
  </g>
</svg>
