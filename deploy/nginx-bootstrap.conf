# The first-certificate bootstrap.
#
# The real site config (nginx.conf here) references the Let's Encrypt
# certificate files, so nginx refuses to load it before the first certificate
# exists — and certbot cannot issue one until nginx serves the challenge.
# This block breaks that loop: it serves only the ACME challenge on port 80.
#
# Use it once, then remove it:
#
#   sudo mkdir -p /var/www/certbot
#   sudo cp deploy/nginx-bootstrap.conf /etc/nginx/sites-enabled/certbot-bootstrap.conf
#   sudo sed -i 's/notes.example.com/<your domain>/' /etc/nginx/sites-enabled/certbot-bootstrap.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot certonly --webroot -w /var/www/certbot -d <your domain>
#   sudo rm /etc/nginx/sites-enabled/certbot-bootstrap.conf
#
# Renewals never need it again: the real config keeps the same challenge
# location reachable over plain HTTP.

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
