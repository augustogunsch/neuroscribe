# Neuroscribe behind nginx.
#
# Copy to /etc/nginx/sites-available/neuroscribe, symlink into sites-enabled,
# replace notes.example.com, then `nginx -t && systemctl reload nginx`.
#
# TLS is not optional here. The browser derives its encryption keys with
# WebCrypto, which browsers expose only in a secure context: served over plain
# HTTP on a public host, sign-up and sign-in do not work at all.

# Buckets for the endpoints worth spending someone else's CPU on. The app
# throttles failed logins itself; this also covers the cost of the work.
limit_req_zone $binary_remote_addr zone=ng_auth:10m  rate=10r/m;

server {
    listen 80;
    listen [::]:80;
    server_name notes.example.com;

    # leave this reachable so certbot can renew
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name notes.example.com;

    ssl_certificate     /etc/letsencrypt/live/notes.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/notes.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    # ECDHE-only, AEAD-only: every suite here has forward secrecy, so traffic
    # recorded today cannot be decrypted later even if this key is stolen. This
    # removes the static-RSA and CBC suites nginx's default list still admits on
    # TLS 1.2. (TLS 1.3 negotiates its own AEAD suites and ignores this line.)
    ssl_ciphers ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    # Session tickets carry a key that rotates only on reload; disabling them
    # closes the forward-secrecy hole where one memory read decrypts every
    # ticket-resumed session. The server-side cache above still gives resumption.
    ssl_session_tickets off;

    # Don't advertise the nginx version in Server: / error pages — free recon.
    server_tokens off;

    # Keep browsers on HTTPS. Add this once the certificate works — it is
    # hard to walk back.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # the largest thing that travels now is one sealed image on its way into
    # the record store
    client_max_body_size 14m;

    # No request ever carries a note: exports and typesetting happen in the
    # browser, so nothing here needs a long timeout or a large body buffer,
    # and nginx has no plaintext to spool to /var/lib/nginx/body.
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # inherited by every location below
    # Host must survive: the app refuses requests whose Host is not in
    # NEUROSCRIBE_ALLOWED_HOSTS, which is what stops DNS rebinding.
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # Overwrite, not append: there is no upstream proxy chain here, so anything
    # the client sent in X-Forwarded-For is forged. The app reads the rightmost
    # entry (and prefers X-Real-IP) when NEUROSCRIBE_TRUST_PROXY is set, so a
    # client-supplied value must not be allowed to survive into it.
    proxy_set_header X-Forwarded-For $remote_addr;
    # The app only believes this header when NEUROSCRIBE_TRUST_PROXY is set;
    # set it in the app's environment so the session cookie gets its Secure flag.
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_http_version 1.1;
    proxy_buffering off;

    # sign-in and sign-up: cheap to request, expensive to serve
    location = /login {
        limit_req zone=ng_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8484;
    }
    location = /register {
        limit_req zone=ng_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8484;
    }
    location = /register/resend {
        limit_req zone=ng_auth burst=3 nodelay;
        proxy_pass http://127.0.0.1:8484;
    }

    # the browser's Python runtime and typesetter: hundreds of MB of
    # immutable static files, worth buffering and worth caching hard
    location ~ ^/(pyodide|typst)/ {
        proxy_pass http://127.0.0.1:8484;
        proxy_buffering on;
    }

    # The service worker decides what every device caches, so it must never
    # itself be served stale — a cached worker keeps an old app alive forever.
    location = /sw.js {
        proxy_pass http://127.0.0.1:8484;
        add_header Cache-Control "no-cache" always;
        # add_header in a location drops all inherited ones, so the server-level
        # HSTS header would vanish on this response (fetched on every worker
        # update check) unless repeated here.
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    # Synchronisation. A first sync on a new device can be a long conversation,
    # and an image push is the largest body the app sends.
    location /sync {
        proxy_pass http://127.0.0.1:8484;
        client_max_body_size 26m;
        proxy_read_timeout 120s;
        # sealed bytes: nothing here is worth spooling to disk
        proxy_max_temp_file_size 0;
    }

    location / {
        proxy_pass http://127.0.0.1:8484;
    }
}
