    <circle cx="310" cy="96" r="4"/>
    <circle cx="268" cy="318" r="5"/>
    <circle cx="523" cy="168" r="8"/>
    <circle cx="404" cy="470" r="4.5"/>
    <circle cx="742" cy="108" r="5"/>
